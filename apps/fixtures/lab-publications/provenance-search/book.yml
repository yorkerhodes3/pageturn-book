  thesis: "Every object in a museum, a saleroom, or a private collection carries an invisible second history alongside its artistic one: the record of who has owned it, when, and how it passed from hand to hand. The problem is not that this information does not exist. It is that it is scattered. Provenance Search assembles what the free public sources say into a single ownership timeline, marks the places where the timeline has holes, and puts a transparent number on how much of the picture is actually supported by retrieved evidence."
