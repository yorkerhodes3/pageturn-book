  thesis: "When a humanitarian organisation decides where to move civilians fleeing conflict, it is rarely choosing between a good option and a bad one. It is choosing between several options it does not fully understand. ERUS exists to make one thing visible: the same underlying reality, assessed under worse information, produces materially worse predicted outcomes. Move the uncertainty slider and predicted success falls while nothing on the ground has changed at all."
