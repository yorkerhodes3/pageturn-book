frontMatter:
  kicker: "Publications · Academic report · Ethical Tech CoLab"
  credits: "Prepared as masters research at the NYU Center for Global Affairs. · NYU Center for Global Affairs · December 2025"
  thesis: "Forced labour is one of the few large-scale human rights violations that almost nobody can count, and the countries where the risk is gravest are frequently the countries where the evidence is thinnest, because the same institutional weakness that permits exploitation also prevents it from being recorded. FLSRI does not try to estimate how many people are in forced labour. It measures something different and, for prevention purposes, more tractable: how strongly the structural conditions that make forced labour more likely are present, and how those conditions combine."
