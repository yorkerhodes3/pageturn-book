  thesis: "A siege does not kill people at a steady rate, and it does not kill them only by shelling. Some days the shells fall. Other days the guns are quiet, and what is killing people is that there has been no heating for three weeks, no running water, no medicine, and no convoy has come through. From a distance, the quiet days can look like improvement. This model produces one number for every day of the siege of Mariupol, built so that a lull in shelling cannot by itself lower the assessment."
