  thesis: "What is ethics, and why did humanity invent it? What makes technology ethical, international relations ethical, and artificial intelligence ethical? This paper answers those questions in that order, on the conviction that the issue at the heart of artificial intelligence is power and that ethics is humanity's oldest and most tested answer to the problem of governing power. It traces ethics from its origins in the earliest civilizations through international affairs and human rights law to the responsible AI movement, the humanitarian sector, and the United Nations system, and closes with the motivation and research philosophy of the Ethical Tech CoLab."
