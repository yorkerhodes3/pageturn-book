  thesis: "Multi-party negotiation is difficult to teach and almost impossible to rehearse. The Diplomatic Simulator asks what happens when the delegations at a crisis table are played by artificial intelligence agents instead of by people. Each delegation is given a confidential brief and nothing else, the talks are run in rounds, and every word spoken is preserved, tagged, and scored. It is a teaching and exploration tool, not a forecasting system, and there is no ground truth anywhere in it."
