  thesis: "Two agents can be placed in a room where the only route between them is a channel that carries no human language, given nothing but shared tasks and the consequences of getting them right or wrong, and asked to build a protocol from scratch. The interesting part is not whether they succeed at the task. It is whether the meanings they each privately record turn out to be the meanings their behaviour actually runs on, and whether an outsider can prove it afterwards from an evidence trail nobody could have edited."
