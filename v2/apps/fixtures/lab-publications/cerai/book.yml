  thesis: "When war forces people to flee, the decision to move a community or shelter it in place is made under extreme time pressure, with incomplete information, and with lives hanging on the outcome. CERAI keeps two questions apart that other tools tend to blend together: how dangerous it is for civilians to remain where they are, and whether an organised evacuation is actually possible right now. Keeping them apart matters legally, because the obligation to protect arises from the danger civilians face, not from whether an evacuation happens to be operationally easy."
