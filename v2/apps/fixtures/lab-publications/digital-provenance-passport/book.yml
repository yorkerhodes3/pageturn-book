  credits: "Carolina Morón, with a project collaborator whose contributions are noted in the repository's source comments. Prepared as masters research at the NYU Center for Global Affairs. · NYU Center for Global Affairs · July 2026"
  thesis: "Provenance research is slow, archival, and applied to only a small fraction of the objects that need it. The Digital Provenance Passport asks what part of the first pass could be done automatically without becoming untrustworthy. It refuses to record any claim that does not carry the address of its source, computes its judgments with arithmetic a non-programmer can read and dispute, and seals its output so that an assessment cannot be quietly improved after the fact."
