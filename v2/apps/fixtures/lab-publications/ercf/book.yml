  thesis: "A humanitarian organisation facing a besieged city has to answer a question that no manual answers well: what would it actually take to move these people, and what would it cost to keep them alive if they cannot be moved? Both questions have to be answered before a funding appeal can be written, and both are usually answered from memory, from a previous operation in a different country, or from an experienced coordinator's intuition. ERCF is a research prototype that attempts to put numbers on both and to show its working."
