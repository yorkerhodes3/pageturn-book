  thesis: "A passport does not evaluate the traveller or rank the countries visited. It records that a person was in a particular place on a particular day. VANGO applies that idea to art: each participating artwork carries a short code, a visitor standing in front of the work scans or types it, and a dated stamp is added to a passport carried on their phone. The application is a record of attendance, not of ownership, value, or authenticity. It answers one question only: who went to see what, and when."
