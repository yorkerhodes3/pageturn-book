  thesis: "Warnings are issued more often than they are believed. Most people do not run when an alert goes out; they telephone a relative, they step outside to see whether the family next door is loading a car, they wait for a second source to say the same thing. That interval between the warning and the departure is where humanitarian evacuations are won or lost, and EvacSim is a research prototype that makes it visible: a small simulated community of six households, each person moving through hearing, believing, preparing, and leaving, with the timing driven by who they are and what information reaches them."
