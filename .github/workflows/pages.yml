name: Deploy reader comparison to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build root-path browser test artifact
        run: npm run build

      - name: Verify packed V3 SDK consumer
        run: npm run test:sdk-consumer

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Build GitHub Pages artifact
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - name: Verify GitHub Pages paths
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run check:pages

      - name: Run GitHub Pages path browser tests
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run test:browser

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
